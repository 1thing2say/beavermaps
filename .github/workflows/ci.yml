# The checks that used to exist and never ran.
#
# This repository had 223 passing tests and nothing that ran them on a push. A
# test suite nobody runs is documentation with a `.test.js` extension — and the
# scan that added this workflow found a build script that had been syntactically
# broken for some time, which `node --check` catches in a tenth of a second and
# which nothing was asking.
#
# Separate jobs rather than one, because they fail for different reasons and a
# combined red tells you less than several separate ones.
#
# Node 24 in every job, the same major as the Dockerfile's node:24-slim, so a
# green tick here is about the runtime that actually ships. 20 reached end of
# life on 2026-04-30.

name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A second push to the same branch makes the first one's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # `npm ci` rather than `npm install`: the lockfile is the input, and a
      # resolution that drifts under CI is a green tick for code nobody ran.
      - run: npm ci
      - run: npm run lint

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # The tokens are inlined at build time, so a build has to have something
      # in their place or Vite emits `undefined` and the bundle is not the one
      # that would ship. These are deliberately fake: the question this job
      # answers is "does it compile", and nothing here talks to Mapbox or Google.
      # A real token in a workflow file would be a real token in a public repo.
      - run: npm run build
        env:
          VITE_MAPBOX_TOKEN: pk.ci-build-only-not-a-real-token
          VITE_GOOGLE_MAPS_KEY: ci-build-only-not-a-real-key

      # The server reads ten committed JSON files at boot and imports two
      # modules out of src/. Listing them individually in the Dockerfile once
      # meant the image built clean and died on the first missing readFileSync —
      # so "does it start" is a separate question from "does it compile".
      - name: the server boots and answers
        run: |
          PORT=8099 node server/index.js &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8099/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8099/healthz | tee /dev/stderr | grep -q '"ok":true'

  audit:
    name: audit
    runs-on: ubuntu-latest
    # Advisories are published against dependencies on their own schedule, so
    # this one going red is news about the world rather than about a commit.
    # It does not gate anything.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Production deps are what the server runs on, at any severity.
      - run: npm audit --omit=dev --audit-level=moderate
      # And the whole tree, because --omit=dev stopped meaning "dev-time only"
      # when deck.gl, loaders.gl and mapbox-gl moved to devDependencies to keep
      # them out of the runtime image: they still reach every visitor, bundled
      # into dist/. High and above only — the moderates under deck.gl's
      # texture-compressor have no patched release and are accepted, and a job
      # that is always red is one nobody reads.
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}

  docker:
    name: docker image
    runs-on: ubuntu-latest
    # The image is what ships, and nothing else here builds it. The build job
    # proves `vite build` compiles and the server boots from a full checkout;
    # this proves the same of the image — a .dockerignore that drops a file the
    # build reads, or a runtime dependency left in devDependencies, passes every
    # other job and dies here.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Placeholder args for the same reason as the build job: the question is
      # "does it build and start", and a real key in a workflow file would be a
      # real key in a public repo. The pk. prefix is what the Dockerfile's guard
      # checks for. The GHA cache keeps the npm ci layers between runs.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: beavermaps:ci
          build-args: |
            VITE_MAPBOX_TOKEN=pk.ci-build-only-not-a-real-token
            VITE_GOOGLE_MAPS_KEY=ci-build-only-not-a-real-key
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The guard is the other half: a build with no token has to fail, or the
      # first `fly deploy` without --build-arg goes live as "This map cannot
      # start" behind a green health check.
      - name: the image refuses to build without a Mapbox token
        id: tokenless
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          target: build
          cache-from: type=gha
      - if: steps.tokenless.outcome != 'failure'
        run: |
          echo "a build with no VITE_MAPBOX_TOKEN succeeded; the Dockerfile guard is gone" >&2
          exit 1

      - name: the container boots and answers
        run: |
          docker run -d --name app -p 8099:8080 beavermaps:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8099/healthz >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8099/healthz | tee /dev/stderr | grep -q '"ok":true'
          curl -sf http://localhost:8099/ | grep -q '<div'
      - name: container logs
        if: failure()
        run: docker logs app || true
