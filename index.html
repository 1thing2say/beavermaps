<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map Project - Custom Routing</title>
    <link href="/src/input.css" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen p-4 md:p-8 font-sans">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Custom Map Router</h1>
        
        <div class="relative rounded-xl shadow-xl overflow-hidden border border-gray-300 bg-white">
            
            <!-- Map Container -->
            <div id="map" style="height: 600px; width: 100%;"></div>

            <!-- GUI Overlay -->
            <div class="absolute top-4 left-4 bg-white/95 backdrop-blur-sm p-5 rounded-lg shadow-lg border border-gray-200 w-72 z-10">
                <h2 class="font-bold text-xl mb-1 text-gray-800">Route Info</h2>
                <p id="instruction-text" class="text-sm text-gray-500 mb-4 pb-3 border-b border-gray-200">
                    Click on the map to set a start point.
                </p>
                
                <div class="space-y-3 mb-4 text-sm font-medium text-gray-700">
                    <div class="flex items-start gap-3">
                        <div class="w-4 h-4 rounded-full bg-green-500 mt-0.5 flex-shrink-0 shadow-sm border border-green-700"></div>
                        <div class="flex flex-col">
                            <span class="text-xs text-gray-400 uppercase tracking-wider">Start Point</span>
                            <span id="start-coord" class="truncate">Not set</span>
                        </div>
                    </div>
                    
                    <div class="flex items-start gap-3">
                        <div class="w-4 h-4 rounded-full bg-red-500 mt-0.5 flex-shrink-0 shadow-sm border border-red-700"></div>
                        <div class="flex flex-col">
                            <span class="text-xs text-gray-400 uppercase tracking-wider">End Point</span>
                            <span id="end-coord" class="truncate">Not set</span>
                        </div>
                    </div>
                </div>

                <div class="pt-3 border-t border-gray-200 bg-gray-50 -mx-5 px-5 py-3 mt-4">
                    <div class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Total Distance</div>
                    <div id="distance-text" class="text-3xl font-bold text-cyan-600">0.00 <span class="text-lg text-gray-500 font-medium">units</span></div>
                </div>

                <div class="px-5 pb-5 -mx-5 bg-gray-50 rounded-b-lg">
                    <button id="clear-btn" class="w-full bg-gray-800 text-white font-semibold py-2.5 rounded-md shadow-sm hover:bg-gray-700 hover:shadow transition-all duration-200">
                        Clear Map
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Vite loads JS as a module -->
    <script type="module" src="/src/main.js"></script>
</body>

</html>
